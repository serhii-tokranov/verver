name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Check formatting
        run: test -z "$(gofmt -l cmd internal)"
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - name: Validate workflow
        run: |
          # actionlint 1.7.12 predates GitHub's documented concurrency queue field.
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 \
            -shellcheck= -pyflakes= \
            -ignore 'unexpected key "queue" for "concurrency" section'

  trusted-tool:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted tool source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.x'
          cache: false
      - name: Build trusted finalizer
        env:
          GOWORK: 'off'
        run: go build -trimpath -o "$RUNNER_TEMP/verver" ./cmd/verver
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verver-finalizer
          path: ${{ runner.temp }}/verver
          retention-days: 1
          if-no-files-found: error

  pr-intent:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    needs: [checks, trusted-tool]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/heads/main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verver-finalizer
          path: ${{ runner.temp }}/verver-tool
      - name: Check squash intent
        env:
          VERVER_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          chmod +x "$RUNNER_TEMP/verver-tool/verver"
          "$RUNNER_TEMP/verver-tool/verver" check-pr \
            --github "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --sha "$PR_SHA" \
            --remote-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"

  version:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && !github.event.deleted
    needs: [checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: verver-release
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: serhii-tokranov/verver@v0.0.3
